# `allowBuilds` MUST be explicit booleans. pnpm writes the placeholder string
# "set this to true or false" the first time it meets an unapproved build
# script, and that unresolved value makes a later `pnpm install` exit non-zero —
# which is what put the frontend dev container into a restart loop once (see the
# same list in packages/frontend/pnpm-workspace.yaml).
# `@w6w/expr` is an ordinary npm dependency in package.json (`^0.1.0`) — that
# is what a consumer of the published `@w6w/ui` gets. Inside this repo we want
# the LIVE sibling checkout instead — no registry fetch on every install, and
# local edits to packages/core picked up immediately — so this override links
# it. It is local-only: pnpm overrides apply only to the project that declares
# them and are not in the published manifest. The linked package exposes its
# TypeScript source under the `w6w-source` export condition, which tsconfig,
# Vite, Storybook, `pnpm test` and the test/ rigs opt into (no expr `dist/`).
overrides:
  '@w6w/expr': 'link:../core/packages/expr'

allowBuilds:
  # Both ship a prebuilt native binary that their install script links into
  # place. `pnpm lint` / `pnpm build` invoke exactly those binaries, so skipping
  # them breaks the toolchain rather than saving anything.
  '@biomejs/biome': true
  esbuild: true
  # Storybook's optional native file watcher. It falls back to a JS watcher when
  # absent, and this only ever runs `storybook dev` locally — not worth
  # compiling a native addon on every install.
  '@parcel/watcher': false
