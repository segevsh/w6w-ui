name: Release

# Publishes @w6w/ui to npm — tokenless, over OIDC. No stored registry
# credential exists in this repo, and none should ever be added: every
# upload mints a short-lived one from the workflow's own identity. Mirrors
# w6w-io/w6w-wrappers' release.yml, which documents this posture at length.
#
# THE FILENAME IS PART OF THE CREDENTIAL. Trusted publishing binds to
# `owner/repo` PLUS this file's name. Renaming `release.yml` silently
# invalidates the publisher registration. Don't.
#
# One-time setup, BEFORE the first release is ever cut:
#   1. `@w6w/expr` must already be on npm at a version satisfying this
#      package's range (`^0.1.0`): the `test` job's pack smoke installs the
#      packed tarball into a clean consumer, which resolves expr from the
#      registry. Publish expr first (core's publish-expr.yml).
#   2. npmjs.com does not let a first-ever publish of a scoped package go
#      through trusted publishing — the package has to exist first. Someone
#      with npm publish rights to the @w6w org does ONE manual first publish
#      of the `pnpm pack` TARBALL (`pnpm build && pnpm pack`, assert it with
#      `node scripts/assert-packed-manifest.mjs <tgz>`, then
#      `npm publish <tgz> --access public`). NEVER `npm publish` of the
#      directory: npm ignores `publishConfig.exports`/`main`/`types`, so it
#      would ship a manifest pointing at `src/*`. (Root CLAUDE.md / memory:
#      "every new @w6w/* name costs one manual publish first; never fix it
#      with a stored CI token" — do not route around this with a secret.)
#   3. THEN, on npmjs.com → @w6w/ui package → Settings → Trusted Publishers,
#      add a GitHub Actions publisher: owner `w6w-io`, repository `w6w-ui`,
#      workflow `release.yml` (or from a shell:
#      `npm trust github @w6w/ui --file release.yml --repo w6w-io/w6w-ui --allow-publish`).
#      No environment needed for npm (unlike PyPI).
#
# Layout: `@w6w/expr` is a plain npm dependency, but this repo's
# pnpm-workspace.yaml overrides it to `link:../core/packages/expr` (live
# sibling source), so every job that installs checks THIS repo out at `ui/`
# and `w6w-io/w6w-core` at `core/` — the same sibling layout as a local
# checkout — and runs from `ui/`.
#
# Release flow: bump the version in package.json, commit, then publish a
# GitHub Release tagged `vX.Y.Z`. `workflow_dispatch` runs the gates, the pack
# smoke and a dry-run publish of the tarball WITHOUT publishing — use it to check a release before cutting
# one.

on:
  release:
    types: [published]
  workflow_dispatch:

# Required for OIDC. This is what replaces a stored NODE_AUTH_TOKEN.
permissions:
  contents: read
  id-token: write

jobs:
  # ── The version gate ────────────────────────────────────────────────────
  # package.json is the only place this package's version lives (no sibling
  # VERSION file, no lockstep across languages like wrappers has) — this job
  # just makes sure the release tag actually agrees with it, so a release
  # can't publish a version nobody meant to cut.
  verify:
    # Fork guard: this workflow reaches the real npm registry and a personal
    # fork carries none of the secrets/trust it needs, so on `segevsh/*` it
    # fails on every push instead of silently doing nothing. Mirrors
    # w6w-wrappers' release.yml and this repo's own docs-dispatch.yml.
    if: github.repository == 'w6w-io/w6w-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: package.json version must match the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "release tag:  $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION, but the release tag is $TAG_VERSION"
            exit 1
          fi

  # ── Gates + build ────────────────────────────────────────────────────────
  # Builds the tarball ONCE (`pnpm pack` — the only packer that applies
  # `publishConfig`'s dist entry points), asserts its manifest, installs it into
  # a clean consumer, and dry-runs the publish of that same tarball.
  test:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
        with:
          path: ui
      - uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-core
          path: core
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:css
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (also what the publish job packs)
        run: pnpm build

      - name: Pack with pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Assert the packed manifest
        run: node scripts/assert-packed-manifest.mjs "$RUNNER_TEMP"/pack/w6w-ui-*.tgz

      - name: Clean-consumer smoke (expr from the npm registry)
        run: UI_TGZ="$(ls "$RUNNER_TEMP"/pack/w6w-ui-*.tgz)" bash test/pack-smoke/run.sh

      - name: Dry-run publish of the tarball, every release/dispatch
        run: npm publish "$(ls "$RUNNER_TEMP"/pack/w6w-ui-*.tgz)" --dry-run

  # ── npm ──────────────────────────────────────────────────────────────────
  # npm >= 11.5.1 detects the trusted publisher itself from this job's OIDC
  # identity — no NODE_AUTH_TOKEN anywhere. The tarball is packed by `pnpm
  # pack`, which applies `publishConfig` so its manifest points at `dist/*`
  # (the top-level fields keep pointing at `src/*` so studio's local
  # `link:../ui` dev flow stays a live source link, exactly as root CLAUDE.md
  # documents). `npm publish <tgz>` uploads exactly those bytes; it never
  # re-reads the directory.
  npm:
    needs: [verify, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
        with:
          path: ui
      - uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-core
          path: core
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack with pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Assert the packed manifest
        run: node scripts/assert-packed-manifest.mjs "$RUNNER_TEMP"/pack/w6w-ui-*.tgz
      - name: Skip publish when this version is already on npm
        id: exists
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "@w6w/ui@$VER" version >/dev/null 2>&1; then
            echo "::notice::@w6w/ui@$VER is already on npm — nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @w6w/ui
        if: steps.exists.outputs.skip != 'true'
        run: npm publish "$(ls "$RUNNER_TEMP"/pack/w6w-ui-*.tgz)" --provenance --access public
